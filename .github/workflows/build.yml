name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # gradle.properties pins org.gradle.java.home to a local Windows JDK, so point Gradle at the runner's JDK instead.
      - name: Build and run GameTests
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: build/gametest/report.xml
          if-no-files-found: ignore
