plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "maple-flavored"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"maple_flavored" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}

	configureTests {
		createSourceSet = true
		modId = "maple_flavored_gametest"
		enableClientGameTests = false
	}
}

loom.runs.named("gameTest") {
	vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file("gametest/report.xml").get().asFile}"
}

// Loom reuses the last run's world, so blocks a test left behind would carry into the next run. Vanilla's own
// GameTest runner starts from a fresh world, and so does this.
def gameTestWorld = layout.buildDirectory.dir("run/gameTest/world")

tasks.named("runGameTest") {
	doFirst {
		gameTestWorld.get().asFile.deleteDir()
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.matching { it.name in ["processResources", "processGametestResources"] }.configureEach {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE")
	from("CREDITS.md")
}
